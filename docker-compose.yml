services:
  db:
    image: pgvector/pgvector:pg16
    container_name: teamflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamflow
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow -d teamflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: teamflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: teamflow-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/teamflow
      KC_DB_USERNAME: teamflow
      KC_DB_PASSWORD: teamflow_password
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamflow-backend
    restart: unless-stopped
    environment:
      DEBUG: "True"
      SEED_DEMO_DATA: "false"
      SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY to a random secret}"
      ALLOWED_HOSTS: "localhost,127.0.0.1,backend,frontend,keycloak,0.0.0.0"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080"
      DATABASE_URL: "postgres://teamflow:teamflow_password@db:5432/teamflow"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      KEYCLOAK_URL: "http://keycloak:8080/realms/teamflow"
      KEYCLOAK_ISSUER_URL: "http://localhost:8080/realms/teamflow"
      KEYCLOAK_CLIENT_ID: "teamflow-app"
      KEYCLOAK_CLIENT_SECRET: ""
      SLACK_SIGNING_SECRET: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      STRIPE_PRICE_GROWTH: ""
      STRIPE_PRICE_ENTERPRISE: ""
      LANGFUSE_PUBLIC_KEY: "pk-lf-teamflow-demo"
      LANGFUSE_SECRET_KEY: "sk-lf-teamflow-demo"
      LANGFUSE_HOST: "http://langfuse:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_staticfiles:/app/staticfiles
      - generated_projects:/workspace/generated_projects

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamflow-celery
    restart: unless-stopped
    entrypoint: []
    command: celery -A teamflow worker --loglevel=info
    environment:
      DEBUG: "True"
      SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY to a random secret}"
      DATABASE_URL: "postgres://teamflow:teamflow_password@db:5432/teamflow"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/0"
      KEYCLOAK_URL: "http://keycloak:8080/realms/teamflow"
      KEYCLOAK_ISSUER_URL: "http://localhost:8080/realms/teamflow"
      KEYCLOAK_CLIENT_ID: "teamflow-app"
      LANGFUSE_PUBLIC_KEY: "pk-lf-teamflow-demo"
      LANGFUSE_SECRET_KEY: "sk-lf-teamflow-demo"
      LANGFUSE_HOST: "http://langfuse:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - generated_projects:/workspace/generated_projects

  langfuse:
    image: langfuse/langfuse:2
    container_name: teamflow-langfuse
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://teamflow:teamflow_password@db:5432/langfuse"
      NEXTAUTH_URL: "http://localhost:3001"
      NEXTAUTH_SECRET: "teamflow-langfuse-secret-key-32chars"
      SALT: "teamflow-langfuse-salt-key-32chars"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      TELEMETRY_ENABLED: "false"

  backend_nest:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    container_name: teamflow-backend-nest
    restart: unless-stopped
    environment:
      PORT: 8001
      DATABASE_URL: "postgresql://teamflow:teamflow_password@db:5432/teamflow"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET to a random secret}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET to a separate random secret}"
      FRONTEND_URL: "http://localhost:3000"
      PYTHON_AI_SERVICE_URL: "http://backend:8000"
      PYTHON_AI_JWT_SECRET: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY to a random secret}"
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
        NEXT_PUBLIC_LANGFUSE_URL: "http://localhost:3001"
    container_name: teamflow-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
      NEXT_PUBLIC_LANGFUSE_URL: "http://localhost:3001"
      NEXT_PUBLIC_KEYCLOAK_URL: "http://localhost:8080"
      NEXT_PUBLIC_KEYCLOAK_REALM: "teamflow"
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: "teamflow-app"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_staticfiles:
  generated_projects:
