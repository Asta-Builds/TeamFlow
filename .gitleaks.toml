title = "TeamFlow secret scan (Gitleaks 8.24)"

# Gitleaks regexes are Go RE2: no lookahead or lookbehind. Use [[rules.allowlists]] instead.

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key or Claude OAuth token"
regex = '''(?i)\b(sk-ant-(?:api03|oat01|sid01)-[a-zA-Z0-9_\-]{20,})\b'''
secretGroup = 1
tags = ["key", "anthropic"]

[[rules]]
id = "hardcoded-database-password"
description = "PostgreSQL or Redis URL with a password in it"
regex = '''(?i)\b(?:postgres(?:ql)?|redis)://[^:\s/@]+:([^@\s/]{8,})@[^\s"'`]+'''
secretGroup = 1
tags = ["database", "password"]

    # Local and in-network dev hosts carry throwaway passwords.
    [[rules.allowlists]]
    regexTarget = "match"
    regexes = ['''@(?:localhost|127\.0\.0\.1|postgres|db)(?:[:/]|$)''']

    # ${POSTGRES_PASSWORD} and similar are placeholders, not secrets.
    [[rules.allowlists]]
    regexes = ['''^\$\{[A-Z0-9_]+\}$''']

[[rules]]
id = "generic-password-assignment"
description = "Password, key or token assigned a literal in source code"
regex = '''(?i)(?:password|passwd|pwd|api_key|apikey|access_token|auth_token|client_secret)\s*[:=]\s*["']([a-zA-Z0-9_\-!@#$%^&*]{16,})["']'''
secretGroup = 1
entropy = 3.5
tags = ["password", "secret"]

# Global allowlist. Lockfiles hold integrity hashes, not secrets. Everything else is
# scanned, tests and .env.example included: only the known CI dummy values are excused.
[allowlist]
description = "Lockfiles and CI dummy values"
paths = [
  '''(^|/)pnpm-lock\.yaml$''',
  '''(^|/)package-lock\.json$''',
]
regexes = [
  '''test_password''',
  '''ci-secret-[a-zA-Z0-9\-]+''',
  '''ci-refresh-secret-[a-zA-Z0-9\-]+''',
  '''ci-bridge-secret-[a-zA-Z0-9\-]+''',
  '''ci-deploy-check-[a-zA-Z0-9\-${}_]+''',
  '''example\.invalid''',
]
