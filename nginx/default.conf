upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_nest_upstream {
    server backend_nest:8001;
}

# TLS terminates at the public load balancer / reverse proxy in front of this
# container. Keep its X-Forwarded-Proto when present so the apps see "https".
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Security headers (the Next.js app adds HSTS and a stricter frame policy).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;

    # Liveness of the proxy itself.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Remote MCP resource server and public OAuth discovery metadata.
    location = /mcp {
        proxy_pass http://backend_nest_upstream;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header Last-Event-ID $http_last_event_id;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://backend_nest_upstream;
    }

    location = /.well-known/oauth-authorization-server {
        proxy_pass http://backend_nest_upstream;
    }

    # --- Django: only the public endpoints that must reach it directly ---------

    # Signed status reports from the deployment provider.
    location ~ ^/api/deployments/[0-9]+/provider_callback/?$ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        client_max_body_size 2m;
    }

    # Stripe webhooks (verified with the Stripe signing secret).
    location = /api/billing/webhook/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        client_max_body_size 1m;
    }

    # Slack Events API (verified with the Slack signing secret).
    location = /api/integrations/slack/events/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        client_max_body_size 1m;
    }

    # Django admin and its static files.
    location /admin/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    location /static/ {
        proxy_pass http://backend_upstream;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --- NestJS: the application API used by the web app -----------------------

    location ~ ^/api/auth/(login|register|refresh|clerk|keycloak|change-password)/?$ {
        limit_req zone=auth_limit burst=20 nodelay;
        proxy_pass http://backend_nest_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Server-sent events must not be buffered.
    location ~ ^/api/agents/events/stream/?$ {
        proxy_pass http://backend_nest_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://backend_nest_upstream;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }

    # --- Next.js web app ---------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
