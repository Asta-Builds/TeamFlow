# Python quality gate for backend/ and cli/ (factory Phase 1).
# Run from the repo root: ruff check backend cli   (CI pins ruff 0.17.4)

target-version = "py310"
extend-exclude = ["**/migrations/**", "**/.venv/**", "**/venv/**"]

[lint]
# Real defects only: syntax errors, undefined names, unused imports and variables,
# and broken statements. Style is not gated here.
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
# Findings that predate this gate (2026-11-07), so it could ship without touching
# the backend. Shrink only: when you clean a file, delete its line. Never add one.
