apiVersion: v1
kind: ConfigMap
metadata:
  name: teamflow-config
  namespace: teamflow
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  CORS_ALLOWED_ORIGINS: "https://teamflow.yourdomain.com,http://localhost:3000"
  CSRF_TRUSTED_ORIGINS: "https://teamflow.yourdomain.com"
  NEXT_PUBLIC_API_URL: "/api"
  PORT: "3000"
---
apiVersion: v1
kind: Secret
metadata:
  name: teamflow-secrets
  namespace: teamflow
type: Opaque
stringData:
  SECRET_KEY: "replace-with-a-very-secure-random-secret-key"
  DATABASE_URL: "postgres://teamflow:teamflow_k8s_pw@postgres-service:5432/teamflow"
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
