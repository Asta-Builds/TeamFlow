[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "teamflow-cli"
version = "0.1.0"
description = "Command-line client for the TeamFlow platform."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "filelock>=3.13",
    "httpx>=0.27",
    "prompt_toolkit>=3.0.36",
    "rich>=13.7",
    "typer>=0.16",
]

[project.scripts]
teamflow = "teamflow_cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["teamflow_cli"]
