name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-django:
    name: Backend Django (Tests & Migrations)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_teamflow
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Django Models, System Checks & Migrations
        env:
          DATABASE_URL: postgres://teamflow:test_password@localhost:5432/test_teamflow
          SECRET_KEY: test-key-for-ci
          DEBUG: "True"
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py migrate --noinput

      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: postgres://teamflow:test_password@localhost:5432/test_teamflow
          SECRET_KEY: test-key-for-ci
          DEBUG: "True"
        run: |
          cd backend
          python manage.py test

  backend-nest:
    name: Backend NestJS (74 Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend-nest/package-lock.json

      - name: Install NestJS Dependencies
        run: |
          cd backend-nest
          npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: |
          cd backend-nest
          npx prisma generate

      - name: Lint NestJS Codebase
        run: |
          cd backend-nest
          npm run lint

      - name: Run NestJS Unit Tests (Vitest)
        env:
          JWT_SECRET: "ci-secret-jwt-key-minimum-32-characters-length"
          JWT_REFRESH_SECRET: "ci-refresh-secret-jwt-key-minimum-32-chars"
          PYTHON_AI_JWT_SECRET: "ci-bridge-secret-key-32-characters-minimum"
        run: |
          cd backend-nest
          npm test

      - name: Build NestJS Production Artifacts
        run: |
          cd backend-nest
          npm run build

  frontend:
    name: Frontend Next.js 16 (26 Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint Frontend Codebase
        run: |
          cd frontend
          npm run lint

      - name: Run Frontend Unit Tests (Vitest)
        run: |
          cd frontend
          npm test

      - name: Next.js Typecheck & Production Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8001/api
        run: |
          cd frontend
          npm run build
