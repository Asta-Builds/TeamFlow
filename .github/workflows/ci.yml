name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-django:
    name: Backend Django (tests, migrations, deploy checks)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_teamflow
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://teamflow:test_password@localhost:5432/test_teamflow
      SECRET_KEY: "ci-secret-key-minimum-32-characters-length-security"
      GIT_AUTHOR_NAME: "TeamFlow CI Agent"
      GIT_AUTHOR_EMAIL: "agents@example.invalid"
      AGENT_EMAIL_DOMAIN: "example.invalid"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify models, system checks and migrations
        env:
          DEBUG: "True"
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py migrate --noinput

      - name: Production configuration check
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: "teamflow.example.com"
          CSRF_TRUSTED_ORIGINS: "https://teamflow.example.com"
          CORS_ALLOWED_ORIGINS: "https://teamflow.example.com"
          SECRET_KEY: "ci-deploy-check-${{ github.run_id }}-a-long-random-looking-secret-value-0123456789"
        run: |
          cd backend
          python manage.py check --deploy --fail-level ERROR

      - name: Run backend tests
        env:
          DEBUG: "True"
        run: |
          cd backend
          python manage.py test --noinput

  workspace-flows:
    name: Workspace flows (Django schema + NestJS)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_teamflow
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://teamflow:test_password@localhost:5432/test_teamflow
      SECRET_KEY: "ci-secret-key-minimum-32-characters-length-security"
      DEBUG: "True"
      GIT_AUTHOR_NAME: "TeamFlow CI Agent"
      GIT_AUTHOR_EMAIL: "agents@example.invalid"
      AGENT_EMAIL_DOMAIN: "example.invalid"
      JWT_SECRET: "ci-secret-jwt-key-minimum-32-characters-length"
      JWT_REFRESH_SECRET: "ci-refresh-secret-jwt-key-minimum-32-chars"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Apply Django migrations
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          cd backend
          python manage.py migrate --noinput

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend-nest/package-lock.json

      - name: Run membership flows through NestJS against the migrated schema
        working-directory: backend-nest
        run: |
          npm ci --legacy-peer-deps
          npx prisma generate
          npm run test:membership-flow

  backend-nest:
    name: Backend NestJS (lint, tests, HTTP tests, build)
    runs-on: ubuntu-latest

    env:
      JWT_SECRET: "ci-secret-jwt-key-minimum-32-characters-length"
      JWT_REFRESH_SECRET: "ci-refresh-secret-jwt-key-minimum-32-chars"
      PYTHON_AI_JWT_SECRET: "ci-bridge-secret-key-32-characters-minimum"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend-nest/package-lock.json

      - name: Install NestJS Dependencies
        working-directory: backend-nest
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: backend-nest
        run: npx prisma generate

      - name: Lint
        working-directory: backend-nest
        run: npm run lint

      - name: Type check
        working-directory: backend-nest
        run: npx tsc --noEmit -p tsconfig.json

      - name: Unit tests
        working-directory: backend-nest
        run: npm test

      - name: HTTP tests (builds the app first)
        working-directory: backend-nest
        run: npm run test:e2e

  frontend:
    name: Frontend Next.js (lint, tests, build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Type check and production build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api
        run: npm run build

  deployment-config:
    name: Deployment configuration (compose, nginx, images)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate production compose file
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.production.example config --quiet

      - name: Validate nginx configuration
        run: |
          docker run --rm \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            --add-host backend:127.0.0.1 --add-host frontend:127.0.0.1 --add-host backend_nest:127.0.0.1 \
            nginx:1.27-alpine nginx -t

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build backend-nest image
        uses: docker/build-push-action@v6
        with:
          context: ./backend-nest
          push: false
          cache-from: type=gha,scope=backend-nest
          cache-to: type=gha,mode=max,scope=backend-nest

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
