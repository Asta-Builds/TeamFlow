name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        # Agent migrations create pgvector extension/indexes; plain PostgreSQL
        # does not provide the required `vector` extension.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: test_teamflow
          POSTGRES_USER: teamflow
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Django Models, System Checks & Migrations
        env:
          DATABASE_URL: postgres://teamflow:test_password@localhost:5432/test_teamflow
          SECRET_KEY: test-key-for-ci
          DEBUG: "True"
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py migrate --noinput

      - name: Run Backend Unit & Integration Tests
        env:
          DATABASE_URL: postgres://teamflow:test_password@localhost:5432/test_teamflow
          SECRET_KEY: test-key-for-ci
          DEBUG: "True"
        run: |
          cd backend
          python manage.py test

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Next.js Typecheck and Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
        run: |
          cd frontend
          npm run lint
          npm run build
