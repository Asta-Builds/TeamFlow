name: Production Image Build & Publish

# Images are published only after the CI pipeline succeeds on main, or for
# release tags. This workflow does not roll anything out; see
# docs/PREPROD_RUNBOOK.md for promoting a published tag to an environment.
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & push ${{ matrix.component }}
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            build_args: ""
          - component: backend-nest
            context: ./backend-nest
            build_args: ""
          - component: frontend
            context: ./frontend
            build_args: |
              NEXT_PUBLIC_API_URL=/api

    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=sha-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
            type=raw,value=main,enable=${{ github.event_name == 'workflow_run' }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
