# TeamFlow production / pre-production stack.
#
#   cp .env.production.example .env.production   # fill in every value
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only nginx publishes a port. Terminate TLS in front of it (load balancer or
# host reverse proxy) and forward X-Forwarded-Proto. See docs/PREPROD_RUNBOOK.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-django-env: &django-env
  DEBUG: "False"
  SEED_DEMO_DATA: "false"
  SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env.production}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env.production}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?Set CSRF_TRUSTED_ORIGINS in .env.production}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
  REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env.production}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:?Set CELERY_BROKER_URL in .env.production}
  RABBITMQ_URL: ${RABBITMQ_URL:-}
  RABBITMQ_MANAGEMENT_URL: ${RABBITMQ_MANAGEMENT_URL:-}
  WORKSPACE_ROOT: /workspace
  AGENT_EMAIL_DOMAIN: ${AGENT_EMAIL_DOMAIN:?Set AGENT_EMAIL_DOMAIN in .env.production}
  GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:?Set GIT_AUTHOR_NAME in .env.production}
  GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:?Set GIT_AUTHOR_EMAIL in .env.production}
  AGENT_PROTECTED_REPOS: ${AGENT_PROTECTED_REPOS:?Set AGENT_PROTECTED_REPOS (the TeamFlow repository) in .env.production}
  AGENT_ALLOW_PLATFORM_GITHUB_TOKEN: ${AGENT_ALLOW_PLATFORM_GITHUB_TOKEN:-false}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITHUB_ORG: ${GITHUB_ORG:-}
  DEPLOY_HOOK_URL_DEV: ${DEPLOY_HOOK_URL_DEV:-}
  DEPLOY_HOOK_URL_STAGING: ${DEPLOY_HOOK_URL_STAGING:-}
  DEPLOY_HOOK_URL_PRODUCTION: ${DEPLOY_HOOK_URL_PRODUCTION:-}
  DEPLOY_HOOK_SECRET: ${DEPLOY_HOOK_SECRET:-}
  DEPLOY_CALLBACK_BASE_URL: ${DEPLOY_CALLBACK_BASE_URL:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
  STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
  ALLOW_MOCK_BILLING: "false"
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  LLM_FIXTURE_DIR: ${LLM_FIXTURE_DIR:-}
  LLM_RECORD_DIR: ${LLM_RECORD_DIR:-}
  CELERY_TASK_SOFT_TIME_LIMIT: ${CELERY_TASK_SOFT_TIME_LIMIT:-900}
  CELERY_TASK_TIME_LIMIT: ${CELERY_TASK_TIME_LIMIT:-960}
  GITHUB_API_URL: ${GITHUB_API_URL:-}
  GITHUB_WEB_URL: ${GITHUB_WEB_URL:-}
  LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
  LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
  LANGFUSE_HOST: ${LANGFUSE_HOST:-}
  LANGFUSE_UI_HOST: ${LANGFUSE_UI_HOST:-}
  LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-}
  KEYCLOAK_URL: ${KEYCLOAK_URL:-}
  KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-}
  KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    logging: *default-logging
    command: redis-server --appendonly yes
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    logging: *default-logging
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-teamflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-replace-with-a-strong-password}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_prod_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-teamflow}-backend:${IMAGE_TAG:-local}
    restart: always
    logging: *default-logging
    environment:
      <<: *django-env
      APP_ROLE: web
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_prod_staticfiles:/app/staticfiles
      - generated_projects:/workspace/generated_projects

  celery_worker:
    image: ${IMAGE_PREFIX:-teamflow}-backend:${IMAGE_TAG:-local}
    restart: always
    logging: *default-logging
    command: ["celery", "-A", "teamflow", "worker", "--loglevel=info", "--concurrency=${CELERY_CONCURRENCY:-2}"]
    environment:
      <<: *django-env
      APP_ROLE: worker
    healthcheck:
      test: ["CMD-SHELL", "celery -A teamflow inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null || exit 1"]
      interval: 60s
      timeout: 20s
      start_period: 60s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - generated_projects:/workspace/generated_projects

  backend_nest:
    build:
      context: ./backend-nest
      dockerfile: Dockerfile
    image: ${IMAGE_PREFIX:-teamflow}-backend-nest:${IMAGE_TAG:-local}
    restart: always
    logging: *default-logging
    environment:
      PORT: "8001"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.production}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.production}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in .env.production}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS in .env.production}
      PYTHON_AI_SERVICE_URL: ${PYTHON_AI_SERVICE_URL:?Set PYTHON_AI_SERVICE_URL (http://backend:8000) in .env.production}
      PYTHON_AI_JWT_SECRET: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env.production}
      AGENT_EMAIL_DOMAIN: ${AGENT_EMAIL_DOMAIN:?Set AGENT_EMAIL_DOMAIN in .env.production}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-}
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL:-}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-}
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_CORS_ALLOWED_ORIGINS: ${MCP_CORS_ALLOWED_ORIGINS:-}
      ALLOW_MOCK_BILLING: "false"
      BILLING_PRICE_LABEL_STARTER: ${BILLING_PRICE_LABEL_STARTER:-}
      BILLING_PRICE_LABEL_GROWTH: ${BILLING_PRICE_LABEL_GROWTH:-}
      BILLING_PRICE_LABEL_ENTERPRISE: ${BILLING_PRICE_LABEL_ENTERPRISE:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      LANGFUSE_UI_HOST: ${LANGFUSE_UI_HOST:-}
      LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL (/api) in .env.production}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_LANGFUSE_URL: ${NEXT_PUBLIC_LANGFUSE_URL:-}
    image: ${IMAGE_PREFIX:-teamflow}-frontend:${IMAGE_TAG:-local}
    restart: always
    logging: *default-logging
    environment:
      PORT: "3000"
    depends_on:
      backend_nest:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: always
    logging: *default-logging
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
      backend_nest:
        condition: service_healthy
      frontend:
        condition: service_healthy

volumes:
  postgres_prod_data:
  redis_prod_data:
  rabbitmq_prod_data:
  backend_prod_staticfiles:
  generated_projects:
